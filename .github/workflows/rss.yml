name: Generate RSS

on:
  schedule:
    - cron: "0 6 * * *"   # kör varje dag kl 06:00 UTC
  workflow_dispatch:       # gör att du kan köra manuellt

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # krävs för git push

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run program
        run: dotnet run --project MatsedelRss/MatsedelRss.csproj

      - name: Ensure docs folder exists
        run: mkdir -p docs

      - name: Copy generated RSS to docs/
        run: |
          cp -r MatsedelRss/bin/Release/net9.0/output/* docs/ || echo "No files to copy"

      - name: Commit and push updated RSS
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/*.xml
          git commit -m "Update RSS feed" || echo "No changes to commit"
          git push
