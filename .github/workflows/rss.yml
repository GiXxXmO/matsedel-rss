name: Generate RSS

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run program
        run: dotnet run --project MatsedelRss/MatsedelRss.csproj --configuration Release --no-build

      - name: List generated files
        run: |
          echo "Contents of output directory:"
          ls -la output/ || echo "Output directory not found"

      - name: Commit and push RSS files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ pushid.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update RSS feeds and menu images [skip ci]"
          git push
