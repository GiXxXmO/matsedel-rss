name: Generate RSS

on:
  schedule:
    - cron: "0 4 * * *"   # kör varje dag kl 06:00 UTC
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run program
        run: dotnet run --project MatsedelRss/MatsedelRss.csproj

      - name: "Debug: list all possible output folders"
        run: |
          echo "Listing Release output:"
          ls -R MatsedelRss/bin/Release/net9.0 || true
          echo "Listing Debug output:"
          ls -R MatsedelRss/bin/Debug/net9.0 || true
          echo "Listing root output folder:"
          ls -R output || true

      - name: Ensure docs folder exists
        run: mkdir -p docs

      - name: Copy generated RSS files to docs/
        run: |
          echo "Searching for XML files..."
          FOUND=false

          if compgen -G "MatsedelRss/bin/Release/net9.0/output/*.xml" > /dev/null; then
            echo "Found XML files in Release output"
            cp MatsedelRss/bin/Release/net9.0/output/*.xml docs/
            FOUND=true
          fi

          if compgen -G "MatsedelRss/bin/Debug/net9.0/output/*.xml" > /dev/null; then
            echo "Found XML files in Debug output"
            cp MatsedelRss/bin/Debug/net9.0/output/*.xml docs/
            FOUND=true
          fi

          if compgen -G "output/*.xml" > /dev/null; then
            echo "Found XML files in root output folder"
            cp output/*.xml docs/
            FOUND=true
          fi

          if [ "$FOUND" = false ]; then
            echo "No XML files found anywhere"
          fi

      - name: Commit and push updated RSS
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if compgen -G "docs/*.xml" > /dev/null; then
            git add docs/*.xml
            git commit -m "Update RSS feed" || echo "No changes to commit"
            git push
          else
            echo "No XML files in docs/, skipping commit"
          fi
