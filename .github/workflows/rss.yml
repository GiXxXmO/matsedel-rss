name: Generate RSS

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install fonts for ImageSharp
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run program
        run: dotnet run --project MatsedelRss/MatsedelRss.csproj --configuration Release --no-build

      - name: List generated files
        run: |
          echo "Contents of output directory:"
          ls -la output/ || echo "Output directory not found"

      - name: Copy files to docs directory
        run: |
          echo "=== Creating docs directory if it doesn't exist ==="
          mkdir -p docs

          echo "=== Copying RSS feeds and images to docs ==="
          cp -v output/*.xml docs/
          cp -v output/*.png docs/

          echo "=== Contents of docs directory ==="
          ls -la docs/

      - name: Commit and push RSS files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "=== Git Status Before Add ==="
          git status

          echo "=== Adding files ==="
          git add docs/ output/ pushid.json

          echo "=== Git Status After Add ==="
          git status

          echo "=== Git Diff ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "=== Committing changes ==="
            git commit -m "Update RSS feeds and menu images [skip ci]"

            echo "=== Pushing to GitHub ==="
            git push

            echo "=== Push completed ==="
          fi
